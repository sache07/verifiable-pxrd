install_script = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -ne 1 ]]; then
  echo "usage: $0 ENVIRONMENT_DIRECTORY" >&2
  exit 2
fi

target=$1
script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
command -v uv >/dev/null || { echo "uv is required" >&2; exit 1; }
uv venv --python 3.11 "$target"
uv pip sync --python "$target/bin/python" "$script_dir/requirements.lock"
"$target/bin/python" -c 'import ase, numpy, pymatgen, pyxtal, scipy, spglib'
echo "materials-science environment installed at $target"
'''

[environment.installation.gsasii]
commit = "c8f97a500d7e48fddbaf8586948c24b174d8bab3"
reported_revision = 5837
requirements_lock = '''
numpy==1.26.4
ply==3.11
prettytable==3.18.0
pycifrw==5.0.1
scipy==1.17.1
wcwidth==0.8.2
'''
install_script = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -ne 1 ]]; then
  echo "usage: $0 INSTALL_ROOT" >&2
  exit 2
fi

install_root=$1
source_dir=$install_root/source
venv_dir=$install_root/venv
script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
commit=c8f97a500d7e48fddbaf8586948c24b174d8bab3
command -v git >/dev/null || { echo "git is required" >&2; exit 1; }
command -v uv >/dev/null || { echo "uv is required" >&2; exit 1; }
if [[ -e "$source_dir" || -e "$venv_dir" ]]; then
  echo "refusing to overwrite $source_dir or $venv_dir" >&2
  exit 1
fi
mkdir -p "$install_root"
git clone https://github.com/AdvancedPhotonSource/GSAS-II.git "$source_dir"
git -C "$source_dir" checkout --detach "$commit"
uv venv --python 3.11 "$venv_dir"
uv pip install --python "$venv_dir/bin/python" -r "$script_dir/gsas-requirements.lock"
uv pip install --python "$venv_dir/bin/python" -e "$source_dir"
"$venv_dir/bin/python" -c \
  'from GSASII import GSASIIpath, GSASIIscriptable; print(GSASIIpath.GetVersionNumber())'
echo "GSAS-II installed at $install_root"
'''

[environment.installation.dicvol14]
binary_sha256 = "317430d2806ec8e4ed8f87b70940d9315092cab0869f84e479ec1c6e3bb5e586"
install_script = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -ne 2 ]]; then
  echo "usage: $0 AUTHORIZED_DICVOL14_BINARY INSTALL_ROOT" >&2
  exit 2
fi

source_binary=$1
install_root=$2
expected=317430d2806ec8e4ed8f87b70940d9315092cab0869f84e479ec1c6e3bb5e586
actual=$(sha256sum "$source_binary" | cut -d ' ' -f 1)
if [[ "$actual" != "$expected" ]]; then
  echo "DICVOL14 SHA-256 mismatch: $actual" >&2
  exit 1
fi
if [[ -e "$install_root/bin/dicvol14" ]]; then
  echo "refusing to overwrite $install_root/bin/dicvol14" >&2
  exit 1
fi
mkdir -p "$install_root/bin"
cp "$source_binary" "$install_root/bin/dicvol14"
chmod 0755 "$install_root/bin/dicvol14"
echo "DICVOL14 installed at $install_root"
'''
