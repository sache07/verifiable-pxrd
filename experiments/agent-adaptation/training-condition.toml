schema_version = 1
status = "training-mutable"
id = "adapted-codex-training"
adapter = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
capability = "experiments/agent-adaptation/working-package"
prompt = "experiments/agent-adaptation/prompts/solve.md"
cpu_quota = "200%"
memory_max = "5G"
tasks_max = 128
timeout_seconds = 3600
network = false
systemd_scope = true
codex = "${VPBENCH_CODEX}"

[environment]
path_entries = [
  "${VPBENCH_DICVOL_ROOT}/bin",
  "${VPBENCH_MATSCI_ENV}/bin",
]
read_paths = [
  "${VPBENCH_MATSCI_ENV}",
  "${VPBENCH_GSAS_ENV}",
  "${VPBENCH_DICVOL_ROOT}",
  "${VPBENCH_COD_METADATA}",
  "${VPBENCH_COD_CIFS}",
]
optional_read_paths = [
  "${VPBENCH_UV_PYTHON}",
  "${VPBENCH_CODEX_STANDALONE}",
]
deny_paths = [
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/ase/test",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyocse/data",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyxtal/database/cifs",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyxtal/database/bug.json",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyxtal/database/mech.db",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyxtal/database/test.db",
]

[environment.variables]
GSAS2_PYTHON = "${VPBENCH_GSAS_ENV}/bin/python"

[environment.installation.matsci]
python_version = "3.11.15"
requirements_input = '''
numpy
scipy
pymatgen
spglib
ase
pyxtal
matplotlib
pandas
'''
