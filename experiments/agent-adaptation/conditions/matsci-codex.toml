schema_version = 1
id = "matsci-codex"
adapter = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"
prompt = "experiments/agent-adaptation/prompts/solve.md"
cpu_quota = "200%"
memory_max = "5G"
tasks_max = 128
network = false
systemd_scope = true
codex = "${VPBENCH_CODEX}"

[environment]
path_entries = ["${VPBENCH_MATSCI_ENV}/bin"]
read_paths = [
  "${VPBENCH_MATSCI_ENV}",
  "${VPBENCH_COD_METADATA}",
  "${VPBENCH_COD_CIFS}",
]
optional_read_paths = [
  "${VPBENCH_UV_PYTHON}",
  "${VPBENCH_CODEX_STANDALONE}",
]
deny_paths = [
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/ase/test",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyocse/data",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyxtal/database/cifs",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyxtal/database/bug.json",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyxtal/database/mech.db",
  "${VPBENCH_MATSCI_ENV}/lib/python3.11/site-packages/pyxtal/database/test.db",
]

[environment.installation.matsci]
python_version = "3.11.15"
requirements_input = '''
numpy
scipy
pymatgen
spglib
ase
pyxtal
matplotlib
pandas
'''
requirements_lock = '''
ase==3.29.0
bibtexparser==1.4.4
certifi==2026.7.22
charset-normalizer==3.4.9
contourpy==1.3.3
cycler==0.12.1
fonttools==4.63.0
idna==3.18
importlib-metadata==9.0.0
joblib==1.5.3
kiwisolver==1.5.0
lxml==6.1.1
matplotlib==3.11.1
monty==2026.7.16
mpmath==1.3.0
narwhals==2.24.0
networkx==3.6.1
numpy==2.4.6
orjson==3.11.9
packaging==26.2
palettable==3.3.3
pandas==3.0.3
pillow==12.3.0
plotly==6.9.0
psutil==7.2.2
pymatgen-core==2026.7.16
pymatgen==2026.5.4
pyocse==0.1.3
pyparsing==3.3.2
python-dateutil==2.9.0.post0
pyxtal==1.1.4
requests==2.34.2
ruamel-yaml==0.19.1
scipy==1.17.1
six==1.17.0
spglib==2.7.0
sympy==1.14.0
