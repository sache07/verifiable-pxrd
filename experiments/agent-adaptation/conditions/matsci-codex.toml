install_script = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ $# -ne 1 ]]; then
  echo "usage: $0 ENVIRONMENT_DIRECTORY" >&2
  exit 2
fi

target=$1
script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
command -v uv >/dev/null || { echo "uv is required" >&2; exit 1; }
uv venv --python 3.11 "$target"
uv pip sync --python "$target/bin/python" "$script_dir/requirements.lock"
"$target/bin/python" -c 'import ase, numpy, pymatgen, pyxtal, scipy, spglib'
echo "materials-science environment installed at $target"
'''
