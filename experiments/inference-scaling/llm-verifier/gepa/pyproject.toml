[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pxrd-gepa-reviewer"
version = "0.1.0"
description = "Standalone GEPA prompt-optimization experiment for a blind pXRD continuation reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gepa>=0.1.0",
  "pymatgen>=2025.1",
]

[project.scripts]
pxrd-gepa = "pxrd_gepa.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pxrd_gepa"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
